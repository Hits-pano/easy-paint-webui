<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Paint</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><text y='400' font-size='400'>🎨</text></svg>">
<style>
  /* 全局底色：和 DSH 的深色主题对齐，界面 CSS 里的颜色变量靠这里兜底 */
  :root {
    --dsw-alias-text-primary: #ededed;
    --dsw-alias-text-secondary: #8b8f96;
    --dsw-alias-accent-primary: #6ba4ff;
    --dsw-alias-accent: #4a7bd0;
    --dsw-alias-bg-elevated: #2b2b2b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #1e1e1e;
    color: #e6e6e6;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  /* 内容居中，最大宽度和 DSH 设置页一致 */
  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }
  /* 加载中的占位 */
  .boot {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: #8b8f96;
    font-size: 13px;
  }
  .boot-err {
    max-width: 560px;
    margin: 60px auto;
    padding: 16px 20px;
    border: 1px solid rgba(207, 106, 95, .5);
    border-radius: 8px;
    color: #e0867c;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<div id="app"><div class="boot">正在加载…</div></div>

<!-- React 18 UMD，随程序一起分发，不走 CDN——断网也能用 -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>

<script>
  // React 没加载成功时给出明确提示，而不是白屏
  if (!window.React || !window.ReactDOM) {
    document.getElementById('app').innerHTML =
      '<div class="boot-err">React 加载失败。\n\n'
      + 'vendor/ 目录下的 react.production.min.js 和 react-dom.production.min.js 可能缺失。\n'
      + '请确认这两个文件在程序目录的 vendor 子目录里。</div>'
  }
</script>

<script type="module" src="./app.js"></script>

</body>
</html>
